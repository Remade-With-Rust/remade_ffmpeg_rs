[package]
name = "rff-codec-av2"
description = "Remade FFmpeg (Rust): AV2 decoder, backed by the in-house pure-Rust rusty_av2d engine (no C/FFI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["av2", "video", "codec", "decoder", "aomedia"]
categories = ["multimedia", "multimedia::video"]

[dependencies]
rff-core.workspace = true
rff-codec.workspace = true
rusty_av2d = { version = "0.2.4", default-features = false, features = [
    "bitdepth_8",
    "bitdepth_16",
] }
