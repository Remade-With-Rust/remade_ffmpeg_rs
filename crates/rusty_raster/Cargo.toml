[package]
name = "rusty_raster"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
# The code descends from tiny-skia 0.12.0 (BSD-3-Clause, itself a port of
# Skia), so the BSD-3-Clause terms travel with it; this crate's own changes are
# Apache-2.0. See NOTICE.md and LICENSE-BSD-3-Clause.
license = "Apache-2.0 AND BSD-3-Clause"
repository = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
authors = ["Mata Network <https://www.mata.network>"]
description = "Pure-Rust 2D rasteriser with a tiny-skia-shaped API: anti-aliased fill and stroke (joins, caps, dashes, hairlines), gradients, blend modes, masks and pixmap drawing. A hardened, forbid(unsafe_code), dependency-free fork of tiny-skia 0.12, pixel-identical to it on a 300+ test corpus."
readme = "README.md"
keywords = ["2d", "rasterizer", "graphics", "vector", "skia"]
categories = ["graphics", "rendering"]
include = ["/LICENSE", "/LICENSE-BSD-3-Clause", "/NOTICE.md", "/README.md", "/src/"]

[features]
default = ["png-format"]
# PNG encode/decode of pixmaps through the house rusty_png crate (debugging and
# tests); the rasteriser itself needs no dependency at all.
png-format = ["dep:rusty_png"]

[dependencies]
rusty_png = { workspace = true, optional = true }

[dev-dependencies]
# The oracle: every corpus image is rendered with both crates and compared.
tiny-skia = "0.12.0"
rusty_alloc-api.workspace = true

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "rasterbench"
test = false

[[example]]
name = "veinbench"
test = false

[[example]]
name = "lossbench"
test = false
