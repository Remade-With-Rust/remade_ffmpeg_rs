[package]
name = "rff-codec-openh264"
description = "Remade FFmpeg (Rust): TEMPORARY H.264 codec via Cisco openh264 (C/FFI). Stopgap until the pure-Rust H.264 lands — NOT pure Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["h264", "openh264", "video", "codec", "ffi"]
categories = ["multimedia", "multimedia::video", "external-ffi-bindings"]
# PUBLISHED, but opt-in only. This is the project's one C/FFI crate. It ships to
# crates.io because `rff` declares it as an OPTIONAL dependency (the
# `h264-openh264` feature) and crates.io must be able to resolve optional deps —
# an unpublished one makes `rff` itself unpublishable. Nobody compiles C unless
# they explicitly enable that feature; the default H.264 path is the pure-Rust
# `rff-codec-h264`.

[dependencies]
rff-core.workspace = true
rff-codec.workspace = true
# openh264 wraps Cisco's C libopenh264 via openh264-sys2 (compiles C with a C
# toolchain). This is the project's ONLY C/FFI dependency and is deliberately
# kept out of the default build (see the `h264-openh264` feature in `rff`).
openh264 = "0.9"
