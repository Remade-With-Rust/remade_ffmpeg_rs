[package]
name = "rff-core"
description = "Remade FFmpeg (Rust): core media primitives — frames, packets, formats, errors (libavutil-equivalent)."
# Published at 0.1.0 before the Mata Network attribution landed; a released
# version is immutable, so this crate carries an explicit patch bump to ship
# it. Deliberately NOT `version.workspace = true` — the rest of the workspace
# is still 0.1.0. Fold back into workspace inheritance at the next bump.
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["ffmpeg", "multimedia", "media", "video", "audio"]
categories = ["multimedia"]

[dependencies]
thiserror.workspace = true
