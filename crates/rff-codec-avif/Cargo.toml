[package]
name = "rff-codec-avif"
description = "Remade FFmpeg (Rust): AVIF still-image codec (AV1 intra frame)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["avif", "av1", "image", "codec", "encoder"]
categories = ["multimedia", "multimedia::images", "multimedia::encoding"]

[dependencies]
rff-core.workspace = true
rff-codec.workspace = true

# AV1 encoder backing the AVIF encode path (rusty-av1-toolkit fork of rav1e).
rusty_av1e.workspace = true
# AV1 decoder backing the AVIF decode path (rusty-av1-toolkit fork of rav1d),
# via its native safe Rust API (`rust_api`).
rusty_av1d.workspace = true

# Native targets get rayon tile-threading; wasm32 stays on the base
# no-threading build (rayon thread spawns panic on wasm at runtime, the same
# lesson as rusty_png's forced-serial DEFLATE).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusty_av1e = { workspace = true, features = ["threading"] }

# The dav1d/rav1e hand-written assembly, behind the default-on `av1-asm`
# feature. These are the SAME two dependencies as above, declared a second
# time as optional with `asm` on: Cargo merges same-named entries, and
# `dep:` switches on only these optional, target-gated edges. So `av1-asm`
# adds `asm` on native targets and is a no-op on wasm, where a build never
# asks for NASM even with default features on. (A separate table because a
# TOML table cannot repeat a key; `target_family = "wasm"` covers wasm32.)
# (rusty_av1d >= 1.2.1 ships `src/arm/asm-offsets.h`; 1.2.0 left it out of
# the package, which broke `asm` on every ARM target, issue #14.)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rusty_av1e = { workspace = true, features = ["asm"], optional = true }
rusty_av1d = { workspace = true, features = ["asm"], optional = true }

[features]
default = ["av1-asm"]
# Hand-written AV1 SIMD assembly (dav1d decode kernels, rav1e encode kernels).
# On x86-64 these are assembled with NASM. Build with `--no-default-features`
# to drop the NASM requirement; AVIF encode and decode then run the slower
# Rust fallback, with byte-identical output.
av1-asm = ["dep:rusty_av1e", "dep:rusty_av1d"]
