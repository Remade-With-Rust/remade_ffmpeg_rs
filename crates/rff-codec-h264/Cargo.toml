[package]
name = "rff-codec-h264"
description = "Remade FFmpeg (Rust): H.264 / AVC video codec — pure Rust via rusty_h264."
# Ahead of the workspace's 0.1: 0.2.0 relaxed the `rusty_h264 ^0.2` pin (which
# silently capped consumers at CAVLC-only 0.2.1) to the 0.8 line; the 0.12
# move (portable Rust SIMD instead of nasm, the lookahead encoder, and the
# `-preset` / `-profile` options that reproduce a device's Baseline stream)
# is released by release-plz from here.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["h264", "avc", "video", "codec", "encoder"]
categories = ["multimedia", "multimedia::video", "multimedia::encoding"]

[dependencies]
rff-core.workspace = true
rff-codec.workspace = true
# Our own pure-Rust H.264 codec. `default-features = false` keeps rff's own
# `#[global_allocator]` in charge (the crate's default installs rusty_alloc
# process-wide) and takes the portable scalar kernels; this crate's `asm`
# feature re-enables rusty_h264's portable Rust SIMD (no assembler, no C).
#
# 0.12 is the last crates.io release before rusty_h264's `no_std` pass; that
# release adds a `std` feature that this row must then ask for explicitly
# (`features = ["std"]`), because a workspace-style `default-features = false`
# consumer otherwise builds the `no_std` arm and hits its `compile_error!`.
rusty_h264 = { version = "0.12", default-features = false }

[features]
# Build the H.264 codec with rusty_h264's portable Rust SIMD kernels
# (SSE2/AVX2 on x86-64, NEON on aarch64). Pure Rust; no `nasm` since 0.10.
asm = ["rusty_h264/asm"]
