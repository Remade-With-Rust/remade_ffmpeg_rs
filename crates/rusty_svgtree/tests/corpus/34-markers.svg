</marker>
<marker id="sq" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="45deg" overflow="visible">
<rect width="8" height="8" fill="#06c"/>
</marker>
<marker id="tri" refX="0" refY="3" markerWidth="4" markerHeight="6" orient="auto">
