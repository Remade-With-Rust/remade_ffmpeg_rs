[package]
name = "rff-targets"
# 0.2.4: published from a buildable commit. Its only earlier commit (96c0e87,
# which created it) cannot package, and release-plz re-packages a crate at the
# last commit that touched it — so that commit failed every release-plz run.
version = "0.2.11"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["ffmpeg", "transcode", "convert", "media", "formats"]
categories = ["multimedia"]
description = "Answers \"what can this media file be converted into?\" from the engine's own codec and container registries."

[dependencies]
rff-core.workspace = true
rff-codec.workspace = true
rff-format.workspace = true
