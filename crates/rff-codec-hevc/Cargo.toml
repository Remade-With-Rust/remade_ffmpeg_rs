[package]
name = "rff-codec-hevc"
description = "Remade FFmpeg (Rust): HEVC / H.265 video decoder — pure Rust via rusty_h265."
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["hevc", "h265", "video", "codec", "decoder"]
categories = ["multimedia", "multimedia::video"]

[dependencies]
rff-core.workspace = true
rff-codec.workspace = true
# The published engine, not the in-tree 0.1 copy: rusty_h265 0.6 is the
# canonical release (its own repo), and the adapter pinned to ^0.1 kept every
# registry consumer on a decoder five minors behind.
rusty_h265 = "0.6"