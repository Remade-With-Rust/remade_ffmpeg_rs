[package]
name = "rusty_webp"
description = "Remade FFmpeg (Rust): pure-Rust WebP codec — a performance/feature fork of image-rs/image-webp 0.2.4."
version = "0.1.1" # 0.1.1: README aligned to the Remade With Rust crate template
edition = "2021"
rust-version = "1.80.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
authors = ["Mata Network <https://www.mata.network>", "image-rs contributors"]
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["webp", "image", "codec", "decoder", "encoder"]
categories = ["multimedia::images", "multimedia::encoding", "encoding"]

[lib]
name = "rusty_webp"
path = "src/lib.rs"

[features]
# Per-stage decode timing printed to stderr (see `vp8::Vp8Decoder`).
profile = []

[dependencies]
byteorder-lite = "0.1.0"
quick-error = "2.0.1"

[dev-dependencies]
rand = "0.8.5"
# House rule: every bench/example measures under the allocator that ships.
rusty_alloc-api.workspace = true
