[package]
name = "rff-subtitle"
description = "Remade FFmpeg (Rust): shared text-subtitle helpers (cue timing parse/format)."
# Published at 0.1.0 before the Mata Network attribution landed; a released
# version is immutable, so this crate carries an explicit patch bump to ship
# it. Deliberately NOT `version.workspace = true` — the rest of the workspace
# is still 0.1.0. Fold back into workspace inheritance at the next bump.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["subtitle", "srt", "webvtt", "captions", "ffmpeg"]
categories = ["multimedia", "parser-implementations"]

[dependencies]
