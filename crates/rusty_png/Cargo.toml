[package]
name = "rusty_png"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/rusty_png"
authors = ["Mata Network <https://www.mata.network>"]
homepage = "https://github.com/Remade-With-Rust/rusty_png"
description = "Pure-Rust PNG decoder + encoder, no C/FFI. Performance fork of image-rs/image-png."
readme = "README.md"
keywords = ["png", "image", "decoder", "encoder"]
categories = ["multimedia::images"]
rust-version = "1.85"
# Ship source + licences + attribution, but NOT the 0.7 MB of test fixtures —
# they exist for CI, and upstream excludes them from its tarball for the same
# reason. (Their absence is exactly why the vendored unit tests failed on the
# first run here: the crates.io tarball this was forked from had no `tests/`.)
include = [
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/NOTICE.md",
    "/README.md",
    "/WHYS.md",
    "/UPSTREAM-CHANGES.md",
    "/UPSTREAM-README.md",
    "/src/",
    "/benches/",
]

[lib]
name = "rusty_png"
path = "src/lib.rs"

[features]
# `zlib-rs` is ON by default. Measured, single core, ABBA, z = 3.87 unless noted:
#
#   Compression::Default — zlib-rs faster on 13/13 images (1.26-2.72x), size
#     within +-4.4%. Strictly dominates; no content class loses.
#   Compression::Best    — photographic: faster (1.68-2.36x) AND smaller.
#     Real graphics: SMALLER on 9/9 (-1.28% to -7.61%) but SLOWER on 5/9
#     (0.62-0.88x). That is not a regression: it reaches sizes miniz_oxide
#     cannot reach at any speed (gfx_diagram 198,896 B vs 215,275 B), and
#     spending time for size is what `Best` exists to do.
#
# The speed sign-flip at `Best` is real and reproduced on real content — it is
# recorded rather than averaged away. See WHYS.md.
default = ["zlib-rs"]
# Exposes internal kernels (unfilter, expand_paletted) so benchmarks and the
# scalar-oracle A/B tests can reach them. Upstream calls this `benchmarks`.
benchmarks = []
unstable = ["crc32fast/nightly"]
# Feature-gated stage profiler (filter / deflate / chunk on encode; inflate /
# unfilter / transform on decode). Scopes are PER ROW, so the tap costs <0.1%
# of a 1080p encode. Compiles to nothing when off.
profile = []

# ---------------------------------------------------------------------------
# DEFLATE backend. This is the measured hot spot, not the PNG layer.
#
# At a matched output size, ffmpeg's PNG encoder (zlib) beat this crate's
# `Compression::Default`/`Best` path by 2.6-4.4x on an 8.3 MPx frame, and the
# PNG-specific work (filtering) was a minor share -- the DEFLATE stream is where
# the time goes. Upstream routes those levels through `flate2`, whose default
# backend is `miniz_oxide`.
#
# `zlib-rs` is flate2's PURE-RUST zlib rewrite (it maps to flate2's `any_zlib`,
# NOT `any_c_zlib`), so selecting it keeps the no-C/no-FFI property this project
# exists for. Off by default until it is measured here.
zlib-rs = ["flate2/zlib-rs"]

[dependencies]
bitflags = "1.0"
crc32fast = "1.2.0"
fdeflate = "0.3.3"
flate2 = "1.0.11"
miniz_oxide = { version = "0.8", features = ["simd"] }

[dev-dependencies]
approx = "0.5.1"
byteorder = "1.5.0"
criterion = "0.4.0"
glob = "0.3"
rand = "0.8.4"

# Upstream's `decoder` bench is dropped: it needs ~10 MB of fixture images that
# the crates.io tarball does not carry, and this fork is benchmarked against a
# real-content corpus (Derf frames + real screenshots/charts) instead. The two
# KERNEL benches below generate their own data and are kept — they are the ones
# an optimisation campaign actually reaches for.
[[bench]]
name = "expand_paletted"
path = "benches/expand_paletted.rs"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "unfilter"
path = "benches/unfilter.rs"
harness = false
required-features = ["benchmarks"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(fuzzing)"]
