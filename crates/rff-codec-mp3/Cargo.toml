[package]
name = "rff-codec-mp3"
description = "MP3 (MPEG-1/2 Audio Layer III) codec adapter for remade_ffmpeg_rs, backed by the pure-Rust rusty_mp3 crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["mp3", "audio", "codec", "decoder", "encoder"]
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]

[dependencies]
rff-core.workspace = true
rff-codec.workspace = true
rusty_mp3.workspace = true

[features]
# Compatibility forwards — the lab harness and telemetry hooks live in
# `rusty_mp3` now (as do the `mp3lab`/`mp3quality` examples).
lab = ["rusty_mp3/lab"]
prometheus-telemetry = ["rusty_mp3/prometheus-telemetry"]
