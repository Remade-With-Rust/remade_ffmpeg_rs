[package]
name = "rff-codec-mp3"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "MP3 (MPEG-1/2 Audio Layer III) codec adapter for remade_ffmpeg_rs, backed by the pure-Rust rusty_mp3 crate"

[dependencies]
rff-core.workspace = true
rff-codec.workspace = true
rusty_mp3.workspace = true

[features]
# Compatibility forwards — the lab harness and telemetry hooks live in
# `rusty_mp3` now (as do the `mp3lab`/`mp3quality` examples).
lab = ["rusty_mp3/lab"]
prometheus-telemetry = ["rusty_mp3/prometheus-telemetry"]
