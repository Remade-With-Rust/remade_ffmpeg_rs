[package]
name = "rff-codec-aac"
description = "Remade FFmpeg (Rust): AAC codec adapter (LC/Main/LTP/HE-AAC v1+v2/LD/ELD decode, AAC-LC encode) over the pure-Rust rusty_aac crate (no C/FFI)."
version = "1.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["aac", "audio", "codec", "decoder", "encoder"]
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]

[features]
# `simd` (default) enables rusty_aac's SIMD twins: the encoder's AVX2 quantize and
# |x|^0.75 kernels, and the decoder's FFT (AVX / NEON) and IMDCT-window (SSE /
# NEON) kernels -- each bit-exact with its scalar fallback, which it keeps.
# `--no-default-features` gives a 100%-safe scalar build. `simd-avx512` adds an
# 8-lane AVX-512 tier on top (opt-in: its intrinsics require Rust ≥1.89, above
# the workspace MSRV; runtime-detected, falls back to AVX2 on non-AVX-512 hosts).
default = ["simd"]
simd = ["rusty_aac/simd"]
simd-avx512 = ["rusty_aac/simd-avx512"]

[dependencies]
rff-core.workspace = true
rff-codec.workspace = true
rusty_aac.workspace = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Style-only, nursery: `match`/`if let` reads more plainly than `map_or_else`.
option_if_let_else = "allow"
