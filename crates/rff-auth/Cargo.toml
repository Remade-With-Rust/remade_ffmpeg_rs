[package]
name = "rff-auth"
description = "Remade FFmpeg (Rust): authentication abstraction with a MATA mID (sovereign identity) verifier."
# Published at 0.1.0 before the Mata Network attribution landed; a released
# version is immutable, so this crate carries an explicit patch bump to ship
# it. Deliberately NOT `version.workspace = true` — the rest of the workspace
# is still 0.1.0. Fold back into workspace inheritance at the next bump.
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
readme = "README.md"
keywords = ["auth", "identity", "mata", "bearer", "ffmpeg"]
categories = ["authentication"]

[features]
default = []
# Enables the MATA mID verifier. The real verification will wire the
# `@matanetwork/sovereign-id-verify` crate (Remade-With-Rust org); until that
# dependency is added the verifier is a clearly-labelled stub.
mata-mid = []

[dependencies]
thiserror.workspace = true
