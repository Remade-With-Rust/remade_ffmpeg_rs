# Detached from the parent workspace on purpose: cargo-fuzz needs nightly and
# links libFuzzer, neither of which should be imposed on the normal build.
[package]
name = "rusty_jpeg-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rusty_jpeg]
path = ".."

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_planar"
path = "fuzz_targets/decode_planar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false
