[workspace]
resolver = "2"
members = ["crates/*"]

# `cargo build` (no args) builds the whole engine + CLI + server, but NOT the
# Dioxus UI — that one pulls a heavy webview toolchain, so build it on demand
# with `cargo build -p rff-ui`.
default-members = [
    "crates/rff-core",
    "crates/rff-codec",
    "crates/rff-format",
    "crates/rff-codec-h264",
    "crates/rff-codec-opus",
    "crates/rff-codec-avif",
    "crates/rff-format-avi",
    "crates/rff-format-avif",
    "crates/rff-codec-png",
    "crates/rff-format-png",
    "crates/rff-codec-jpeg",
    "crates/rff-format-jpeg",
    "crates/rff-codec-gif",
    "crates/rff-format-gif",
    "crates/rff-codec-webp",
    "crates/rff-format-webp",
    "crates/rff-codec-pcm",
    "crates/rff-codec-vorbis",
    "crates/rff-codec-flac",
    "crates/rff-codec-jxl",
    "crates/rff-codec-aac",
    "crates/rff-codec-vp9",
    "crates/rff-codec-mp3",
    "crates/rusty_vp9",
    "crates/rusty_mp3",
    "crates/rusty_aac",
    "crates/rff-codec-rawvideo",
    "crates/rff-format-wav",
    "crates/rff-format-y4m",
    "crates/rff-format-ivf",
    "crates/rff-format-ogg",
    "crates/rff-format-flac",
    "crates/rff-format-mp3",
    "crates/rff-format-jxl",
    "crates/rff-format-mp4",
    "crates/rff-format-mkv",
    "crates/rff-format-ts",
    "crates/rff-format-flv",
    "crates/rff-format-hls",
    "crates/rff-io",
    "crates/rff-subtitle",
    "crates/rff-format-srt",
    "crates/rff-format-webvtt",
    "crates/rff-filter",
    "crates/rff-resample",
    "crates/rff",
    "crates/rff-cli",
    "crates/rff-auth",
    "crates/rff-server",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs"
authors = ["Mata Network <https://www.mata.network>"]
rust-version = "1.85"

[workspace.dependencies]
# Internal crates (path-linked; versions track the workspace).
rff-core = { path = "crates/rff-core", version = "0.0.1" }
rff-codec = { path = "crates/rff-codec", version = "0.0.1" }
rff-format = { path = "crates/rff-format", version = "0.0.1" }
rff-codec-h264 = { path = "crates/rff-codec-h264", version = "0.0.1" }
rff-codec-opus = { path = "crates/rff-codec-opus", version = "0.0.1" }
rff-codec-avif = { path = "crates/rff-codec-avif", version = "0.0.1" }
rff-format-avi = { path = "crates/rff-format-avi", version = "0.0.1" }
rff-format-avif = { path = "crates/rff-format-avif", version = "0.0.1" }
rff-codec-png = { path = "crates/rff-codec-png", version = "0.0.1" }
rff-format-png = { path = "crates/rff-format-png", version = "0.0.1" }
rff-codec-jpeg = { path = "crates/rff-codec-jpeg", version = "0.0.1" }
rff-format-jpeg = { path = "crates/rff-format-jpeg", version = "0.0.1" }
rff-codec-gif = { path = "crates/rff-codec-gif", version = "0.0.1" }
rff-format-gif = { path = "crates/rff-format-gif", version = "0.0.1" }
rff-codec-webp = { path = "crates/rff-codec-webp", version = "0.0.1" }
rff-format-webp = { path = "crates/rff-format-webp", version = "0.0.1" }
rff-codec-pcm = { path = "crates/rff-codec-pcm", version = "0.0.1" }
rff-codec-vorbis = { path = "crates/rff-codec-vorbis", version = "0.0.1" }
rff-codec-flac = { path = "crates/rff-codec-flac", version = "0.0.1" }
rff-codec-jxl = { path = "crates/rff-codec-jxl", version = "0.0.1" }
rff-codec-aac = { path = "crates/rff-codec-aac", version = "0.0.1" }
rff-codec-vp9 = { path = "crates/rff-codec-vp9", version = "0.0.1" }
rff-codec-mp3 = { path = "crates/rff-codec-mp3", version = "0.0.1" }
# Standalone, publishable codec cores (the `rusty_h264` pattern: pure codec
# crate + thin rff-codec-* adapter). Independent 0.1.x versions — these ship
# to crates.io on their own cadence, decoupled from the workspace 0.0.1.
rusty_vp9 = { path = "crates/rusty_vp9", version = "0.1.0" }
rusty_mp3 = { path = "crates/rusty_mp3", version = "0.1.0" }
rusty_aac = { path = "crates/rusty_aac", version = "0.1.0" }
rff-codec-rawvideo = { path = "crates/rff-codec-rawvideo", version = "0.0.1" }
# TEMPORARY C/FFI H.264 — deliberately NOT in default-members; opt-in only.
rff-codec-openh264 = { path = "crates/rff-codec-openh264", version = "0.0.1" }
rff-format-wav = { path = "crates/rff-format-wav", version = "0.0.1" }
rff-format-ogg = { path = "crates/rff-format-ogg", version = "0.0.1" }
rff-format-flac = { path = "crates/rff-format-flac", version = "0.0.1" }
rff-format-mp3 = { path = "crates/rff-format-mp3", version = "0.0.1" }
rff-format-y4m = { path = "crates/rff-format-y4m", version = "0.0.1" }
rff-format-ivf = { path = "crates/rff-format-ivf", version = "0.0.1" }
rff-format-jxl = { path = "crates/rff-format-jxl", version = "0.0.1" }
rff-format-mp4 = { path = "crates/rff-format-mp4", version = "0.0.1" }
rff-format-mkv = { path = "crates/rff-format-mkv", version = "0.0.1" }
rff-format-ts = { path = "crates/rff-format-ts", version = "0.0.1" }
rff-format-flv = { path = "crates/rff-format-flv", version = "0.0.1" }
rff-format-hls = { path = "crates/rff-format-hls", version = "0.0.1" }
rff-io = { path = "crates/rff-io", version = "0.0.1" }
rff-subtitle = { path = "crates/rff-subtitle", version = "0.0.1" }
rff-format-srt = { path = "crates/rff-format-srt", version = "0.0.1" }
rff-format-webvtt = { path = "crates/rff-format-webvtt", version = "0.0.1" }
rff-filter = { path = "crates/rff-filter", version = "0.0.1" }
rff-resample = { path = "crates/rff-resample", version = "0.0.1" }
rff = { path = "crates/rff", version = "0.0.1" }
rff-auth = { path = "crates/rff-auth", version = "0.0.1" }

# Third-party (all permissive — MIT/Apache-2.0; CI-enforced by cargo-deny).
# AV1 encode + decode come from our own rusty-av1-toolkit (BSD-2-Clause forks of
# rav1e / rav1d). We alias them to `rusty_av1e` / `rusty_av1d` (the toolkit dir
# names) via `package = …`, so the forks keep their upstream package names and
# future upstream syncs stay clean. `default-features = false` drops the `asm`
# feature (no nasm toolchain); the decoder keeps both bit depths and exposes the
# native safe Rust API (`rust_api`, mirroring dav1d-rs) — the decode path stays
# 100% safe Rust (no FFI/unsafe in our tree). Pinned to the toolkit's
# `fix/no-asm-avx2-cpufeature` branch commit (a no-asm build fix — the asm-only
# `CpuFeatureLevel` had no `AVX2` variant); re-pin to a main SHA once it merges.
rusty_av1e = { git = "https://github.com/Remade-With-Rust/rusty-av1-toolkit", rev = "b471be0a8da4ee8b90017514bf11735fbacd5bfe", package = "rav1e", default-features = false }
rusty_av1d = { git = "https://github.com/Remade-With-Rust/rusty-av1-toolkit", rev = "b471be0a8da4ee8b90017514bf11735fbacd5bfe", package = "rav1d", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# png: pure-Rust PNG codec (MIT/Apache-2.0), DEFLATE via miniz_oxide/fdeflate.
png = "0.17"
# jpeg: pure-Rust JPEG decode (MIT/Apache) + encode (MIT/Apache AND IJG).
jpeg-decoder = "0.3"
jpeg-encoder = "0.7"
# gif: pure-Rust GIF de/encoder (MIT/Apache); image-webp: pure-Rust WebP (MIT/Apache).
gif = "0.14"
image-webp = "0.2"
# Opus comes from our own rusty-opus (BSD-3-Clause fork of the pure-Rust opus-rs
# port of libopus 1.6 — no FFI). The fork's package is now named `rusty-opus`
# (previously carried upstream's `opus-rs` name — renamed so the crate, Cargo.lock,
# and every benchmark read as `rusty-opus`, not the old baseline label). The dep key
# stays `rusty_opus` so the rff-side imports are unchanged. Our fork adds byte-identical
# AVX2 SILK kernels (~+30% vs the pre-fork scalar baseline) + AVX2 decode kernels
# (resampler FIR, CELT comb filter) + frame-parallel encoding (~3× libopus wall-clock,
# PEAQ-neutral).
# Now consumed from crates.io (v0.1.23 == fork rev 77a838f + publish metadata;
# code-identical, includes the CM1 mono-CELT fix "correct BAND_ALLOCATION row 10").
# Dropping the git pin removes one git dep on rff's own path to crates.io
# (crates.io rejects git dependencies). Bump the version on new fork releases.
rusty_opus = { version = "0.1.23", package = "rusty-opus" }
# lewton: pure-Rust Vorbis decoder (MIT/Apache-2.0) — decode only, no FFI.
lewton = "0.10"
# claxon: pure-Rust FLAC decoder (Apache-2.0) — decode only, no FFI.
claxon = "0.4"
# jxl-oxide: pure-Rust JPEG XL decoder (MIT/Apache-2.0) — decode only, no FFI.
jxl-oxide = "0.12"
# Optional TLS stack for `https://` input (rff-io `https` feature) — all
# permissive AND pure-Rust, so it satisfies both project promises:
#  * rustls (Apache-2.0/ISC/MIT) with NO default provider — `default-features =
#    false` drops the C `aws-lc-rs` backend (and `ring`); we inject a provider.
#  * rustls-rustcrypto (MIT/Apache) supplies a CryptoProvider built on the
#    RustCrypto crates — pure Rust, but pre-1.0 and NOT yet security-audited
#    (constant-time guarantees are weaker than ring/aws-lc-rs): the accepted
#    "burden of immaturity" until a hardened pure-Rust provider lands.
#  * roots come from the OS trust store via rustls-native-certs (Apache/ISC/MIT),
#    deliberately NOT the MPL-2.0 `webpki-roots` Mozilla bundle.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
rustls-native-certs = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
# `unwind` (not `abort`) so decoders can contain a panic on malformed/untrusted
# input at their API boundary (see VP9 `receive_frame`) and surface it as an
# `Err` rather than killing the process. The unwind path is cold (hot decode
# loops never panic), so the cost is binary size, not throughput.
panic = "unwind"

