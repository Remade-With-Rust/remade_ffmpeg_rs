# Build-hardening defaults for the targets the project ships binaries for
# (release.yml: x86_64-unknown-linux-gnu, aarch64-apple-darwin,
# x86_64-pc-windows-msvc). use-protection-please H-04.
#
# Note: target `rustflags` here are replaced, not merged, by a RUSTFLAGS
# environment variable -- set both if you override.

[target.x86_64-unknown-linux-gnu]
rustflags = [
    # Frame pointers: reliable stack walks for profilers and crash reports.
    # Measured cost on the MP3 codec: not resolvable (decode 8/20, encode 8/14,
    # 2026-10-04).
    "-C", "force-frame-pointers=yes",
    # Full RELRO + immediate binding, and a non-executable stack. (PIE is the
    # Rust default on this target.)
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,-z,noexecstack",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "force-frame-pointers=yes",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,-z,noexecstack",
]

# aarch64-apple-darwin: frame pointers are the platform ABI default; the Apple
# linker emits PIE with a non-executable stack by default. Nothing to force.

# x86_64-pc-windows-msvc: no flags. x64 Windows unwinds through .pdata tables,
# so frame pointers add nothing for profilers or crash dumps; the MSVC linker
# defaults already set ASLR (DYNAMIC_BASE), HIGH_ENTROPY_VA and DEP (NX_COMPAT)
# -- verified on target/release/rff.exe (DllCharacteristics 0x8160).
# Control Flow Guard is not enabled (tracked in the hardening plan).
